[project]
name = "beacon"
version = "0.1.0"
description = "Beacon - clinical trial matching engine (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "beacon-llm",
    "gateway",
    "retrieval",
    "match-worker",
    "ingestion",
    "evals",
]

[tool.uv.workspace]
members = ["libs/*", "services/*", "evals"]

[tool.uv.sources]
beacon-core = { workspace = true }
beacon-llm = { workspace = true }
gateway = { workspace = true }
retrieval = { workspace = true }
match-worker = { workspace = true }
ingestion = { workspace = true }
evals = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "alembic>=1.14",
    "mypy>=1.13",
    # Sync driver, for the integration tests only. The services all use
    # asyncpg; this exists so a test can open a plain connection without an
    # event loop, and so it is a declared dependency rather than a transitive
    # one inherited from langgraph-checkpoint-postgres.
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "testcontainers>=4.8",
    "types-requests>=2.32",
]

# ---------------------------------------------------------------- tooling ----

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "ASYNC", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # ClassVar annotations not required on pydantic model config
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
# Without this, ruff guesses from the directory layout and calls the workspace
# packages third-party while treating the alembic/ folder as first-party.
known-first-party = [
    "beacon_core",
    "beacon_llm",
    "gateway",
    "retrieval",
    "match_worker",
    "ingestion",
    "evals",
]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
exclude = ['^\.venv/', '^alembic/versions/', '^web/']
mypy_path = [
    "libs/beacon-core/src",
    "libs/beacon-llm/src",
    "services/gateway/src",
    "services/retrieval/src",
    "services/match_worker/src",
    "services/ingestion/src",
    "evals/src",
]

[[tool.mypy.overrides]]
module = ["ir_datasets.*", "ranx.*", "fastembed.*", "textstat.*", "aiokafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# No testpaths: each agent owns its own package, so its tests live beside its
# code (services/gateway/tests, libs/beacon-llm/tests, ...). Pinning testpaths
# to tests/ would collect none of them and CI would pass while testing nothing.
# importlib import mode is what lets two packages each have a tests/test_main.py
# without pytest raising an import-file-mismatch.
#
# BUT mypy does not use pytest's import mode, and it maps a file with no
# __init__.py to a module named after its basename. Two packages each holding
# tests/test_pipeline.py therefore both become module "test_pipeline" and
# `mypy .` fails with "Duplicate module named ...", which stops type checking
# for the whole repo:
#
#     services/match_worker/tests/test_pipeline.py: error: Duplicate module
#     named "test_pipeline" (also at "./services/ingestion/tests/test_pipeline.py")
#
# Adding __init__.py does not fix it in a src layout - mypy would derive
# "tests.test_pipeline" for both, since services/<name> is not itself a package.
#
# So the rule is: **a test module basename must be unique across the whole
# workspace.** Prefix it with the package when the bare name is generic -
# test_ingest_pipeline.py and test_worker_pipeline.py, not two test_pipeline.py.
# This bit on 9 Nov: B1's and C1's PRs were each green alone and broke mypy only
# once both were merged, because neither branch contained the other's file.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --import-mode=importlib"
norecursedirs = [
    ".venv",
    ".git",
    "web",
    "node_modules",
    "alembic",
    "__pycache__",
    "*.egg-info",
    # Agent worktrees are full checkouts of the repo living inside it. Without
    # this, pytest collects every one of them: the suite ballooned from 169 to
    # 1101 tests and a failure in some agent's in-progress branch would have
    # broken verification on master. ruff and mypy skip them already because
    # they honour .gitignore; pytest does not.
    ".claude",
]
markers = [
    "integration: needs Docker (testcontainers); excluded from the fast unit run",
]
