[project]
name = "beacon-llm"
version = "0.1.0"
description = "Claude wrapper: structured outputs, prompt caching, cost metering, record/replay"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_llm"]
