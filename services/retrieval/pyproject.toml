[project]
name = "retrieval"
version = "0.1.0"
description = "Beacon retrieval service: hybrid dense+sparse search, RRF fusion, cross-encoder rerank"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
