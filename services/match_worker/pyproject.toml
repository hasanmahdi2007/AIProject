[project]
name = "match-worker"
version = "0.1.0"
description = "Beacon match worker: LangGraph pipeline consuming Kafka"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "beacon-llm",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/match_worker"]
