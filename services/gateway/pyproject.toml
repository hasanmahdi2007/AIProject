[project]
name = "gateway"
version = "0.1.0"
description = "Beacon API gateway: auth, rate limits, /v1/matches, SSE"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "beacon-llm",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
