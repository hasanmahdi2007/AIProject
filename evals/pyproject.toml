[project]
name = "evals"
version = "0.1.0"
description = "Beacon evaluation harness: TREC loaders, ranx metrics, ablations, reports"
requires-python = ">=3.12"
dependencies = [
    "beacon-core",
    "ir-datasets>=0.5.9",
    "ranx>=0.3.20",
    "textstat>=0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
